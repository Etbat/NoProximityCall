name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install git make ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
        env:
          THEOS: $HOME/theos

      - name: Create roothide scheme
        run: |
          mkdir -p ~/theos/makefiles/package/arch/all
          cat > ~/theos/makefiles/package/roothide.mk << 'EOF'
          ifeq ($(THEOS_PACKAGE_SCHEME),roothide)
          include $(THEOS_MAKE_PATH)/package/deb.mk
          
          _THEOS_PACKAGE_MAKE_DIRS := $(addprefix -d ,$(foreach dir,$(sort $(dir $(wildcard $(THEOS_STAGING_DIR)/*/%))),$(patsubst %/,%,$(dir))))
          
          before-package::
          	@echo "Building roothide package..."
          
          THEOS_PACKAGE_SCHEME = roothide
          endif
          EOF
        env:
          THEOS: $HOME/theos

      - name: Build DEB
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
        env:
          THEOS: $HOME/theos

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoProximityCall-deb
          path: packages/*.deb
